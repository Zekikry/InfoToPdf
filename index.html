<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFO to PDF</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 
         * PDF Şablonu İçin A4 Stilleri 
         */
        #pdf-template-wrapper {
            display: none; /* Normalde tamamen kapalı, sadece buton basılınca açılır */
        }

        /* 
         * Kırpılma (Clipping) ve 3. Boş Sayfa Hatası Çözümü:
         * PDF oluşturulurken wrapper tam ekranın sol üstüne alınır ve tam görünür yapılır.
         * Toplam yükseklik 593mm (2 sayfa) olarak sabitlenir ki fazladan beyaz sayfa atmasın.
         */
        body.generating-pdf #pdf-template-wrapper {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 210mm; 
            height: 593mm; /* Sadece 2 sayfa kadar yükseklik. Fazladan sayfayı engeller. */
            z-index: 10;
            background: white; 
            overflow: hidden;
        }

        .page {
            width: 210mm;
            height: 296.5mm; /* 297mm yerine 0.5mm az verildi, 3. sayfaya taşma engellendi */
            background: white;
            padding: 10mm 15mm; 
            box-sizing: border-box;
            position: relative;
            font-size: 9.5pt; 
            line-height: 1.35;
            color: #000;
            overflow: hidden; 
            margin: 0;
        }

        /* Sola dayalı başlıklar */
        .doc-title { 
            font-size: 16pt; 
            font-weight: bold; 
            text-align: left; 
            margin-bottom: 2px; 
            color: #000; 
        }
        
        .doc-subtitle { 
            font-size: 11pt; 
            text-align: left; 
            font-weight: 600; 
            color: #1e3a8a; /* Koyu mavi */
            margin-bottom: 10px; 
            border-bottom: 2px solid #1e3a8a; 
            padding-bottom: 6px; 
        }

        /* Orijinal tasarımdaki gri/mavi arka planlı alt başlıklar */
        .section-title { 
            font-size: 10.5pt; 
            font-weight: bold; 
            background-color: #e2e8f0; 
            padding: 4px 8px; 
            margin-top: 12px; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            color: #1e3a8a; 
        }
        
        .step-container { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 2px; 
        }
        
        .step-number { 
            font-weight: bold; 
            font-size: 10pt; 
            width: 18px; 
            flex-shrink: 0; 
            text-align: left;
        }
        
        .step-content { 
            flex-grow: 1; 
            text-align: justify; 
        }

        /* Oklar sayfanın TAM ORTASINA hizalandı (En başa kayması engellendi) */
        .arrow-down { 
            text-align: center; /* Ortaya hizalama yapıldı */
            width: 100%;
            margin-top: 2px;
            margin-bottom: 2px;
            font-weight: bold; 
            font-size: 14pt; /* Oklar belirginleştirildi */
            color: #1e3a8a; 
        }

        .custom-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 6px; 
            margin-bottom: 6px; 
            font-size: 8.5pt; 
        }
        
        .custom-table th, .custom-table td { 
            border: 1px solid #000; 
            padding: 4px 6px; 
            text-align: left; 
            vertical-align: top;
        }
        
        .custom-table th { 
            background-color: #d1d5db; 
            font-weight: bold; 
        }
        
        .custom-table tr:nth-child(even) { 
            background-color: #f9fafb; 
        }

        .footer { 
            position: absolute; 
            bottom: 10mm; 
            left: 15mm; 
            right: 15mm; 
            font-size: 8pt; 
            display: flex; 
            justify-content: space-between; 
            border-top: 1px solid #ccc; 
            padding-top: 4px; 
        }

        /* Loader %100 mat ve kapatıcı (arkadaki PDF'i gizler) */
        #loader { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-color: #111827; 
            z-index: 100; 
            color: white; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        
        .spinner { 
            border: 4px solid rgba(255,255,255,0.2); 
            border-top: 4px solid #3b82f6; 
            border-radius: 50%; 
            width: 50px; height: 50px; 
            animation: spin 1s linear infinite; 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* Bildirim (Toast) Mesajı */
        #toast { 
            visibility: hidden; 
            min-width: 250px; 
            background-color: #10b981; 
            color: #fff; 
            text-align: center; 
            border-radius: 8px; 
            padding: 16px; 
            position: fixed; 
            z-index: 150; 
            left: 50%; bottom: 30px; 
            transform: translateX(-50%); 
            font-size: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        
        #toast.show { 
            visibility: visible; 
            animation: fadein 0.3s, fadeout 0.3s 2.7s; 
        }
        
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-3xl bg-white p-6 sm:p-8 rounded-2xl shadow-xl flex flex-col z-20 relative">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-blue-900 mb-2">INFO to PDF</h1>
        </div>
        
        <div class="flex-grow flex flex-col mb-6">
            <textarea id="csv-input" class="w-full h-32 sm:h-48 p-4 border border-gray-300 rounded-lg font-mono text-xs sm:text-sm bg-gray-50 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y whitespace-pre shadow-inner" spellcheck="false" placeholder=""></textarea>
        </div>
        
        <button onclick="processAndDownloadPDF()" class="w-full bg-blue-700 hover:bg-blue-800 active:bg-blue-900 text-white font-bold py-4 px-6 rounded-lg transition duration-200 shadow-lg flex items-center justify-center gap-3 text-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
            PDF Olarak Dönüştür ve İndir
        </button>

    </div>

    <!-- Bu kısım ekranda görünmez, sadece PDF çıktısı için html2pdf tarafından kullanılır -->
    <div id="pdf-template-wrapper">
        <div id="pdf-root">
            
            <!-- 1. SAYFA -->
            <div class="page" id="page1">
                <div class="doc-title" id="t_doc_title"></div>
                <div class="doc-subtitle"><span id="t_doc_subtitle"></span> <br> <span id="t_doc_type" style="color:#000;"></span></div>
                
                <div class="section-title" id="t_s1_title"></div>
                <p style="text-align: justify; margin-bottom: 8px;" id="t_s1_desc"></p>

                <!-- Adım 1-6 -->
                <div class="step-container"><div class="step-number" id="t_s1_i1_num"></div><div class="step-content" id="t_s1_i1_text"></div></div>
                <div class="arrow-down">↓</div>
                <div class="step-container"><div class="step-number" id="t_s1_i2_num"></div><div class="step-content" id="t_s1_i2_text"></div></div>
                <div class="arrow-down">↓</div>
                <div class="step-container"><div class="step-number" id="t_s1_i3_num"></div><div class="step-content" id="t_s1_i3_text"></div></div>
                <div class="arrow-down">↓</div>
                <div class="step-container"><div class="step-number" id="t_s1_i4_num"></div><div class="step-content" id="t_s1_i4_text"></div></div>
                <div class="arrow-down">↓</div>
                <div class="step-container"><div class="step-number" id="t_s1_i5_num"></div><div class="step-content" id="t_s1_i5_text"></div></div>
                <div class="arrow-down">↓</div>
                <div class="step-container"><div class="step-number" id="t_s1_i6_num"></div><div class="step-content" id="t_s1_i6_text"></div></div>

                <div class="section-title" id="t_s2_title" style="margin-top: 12px;"></div>
                <p style="text-align: justify;" id="t_s2_desc"></p>

                <table class="custom-table">
                    <thead>
                        <tr>
                            <th id="t_tb1_h1" style="width: 25%;"></th>
                            <th id="t_tb1_h2" style="width: 20%;"></th>
                            <th id="t_tb1_h3" style="width: 55%;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td id="t_tb1_r1_c1"></td><td id="t_tb1_r1_c2"></td><td id="t_tb1_r1_c3"></td></tr>
                        <tr><td id="t_tb1_r2_c1"></td><td id="t_tb1_r2_c2"></td><td id="t_tb1_r2_c3"></td></tr>
                        <tr><td id="t_tb1_r3_c1"></td><td id="t_tb1_r3_c2"></td><td id="t_tb1_r3_c3"></td></tr>
                        <tr><td id="t_tb1_r4_c1"></td><td id="t_tb1_r4_c2"></td><td id="t_tb1_r4_c3"></td></tr>
                    </tbody>
                </table>

                <div class="footer">
                    <span id="t_f1_text1"></span>
                    <span>Sayfa 1/2</span>
                </div>
            </div>

            <!-- 2. SAYFA -->
            <div class="page" id="page2">
                
                <div class="section-title" id="t_s3_title" style="margin-top: 0;"></div>
                <p style="text-align: justify; margin-bottom: 6px;" id="t_s3_desc"></p>

                <table class="custom-table">
                    <thead>
                        <tr>
                            <th id="t_tb2_h1" style="width: 25%;"></th>
                            <th id="t_tb2_h2" style="width: 25%;"></th>
                            <th id="t_tb2_h3" style="width: 50%;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td id="t_tb2_r1_c1"></td><td id="t_tb2_r1_c2"></td><td id="t_tb2_r1_c3"></td></tr>
                        <tr><td id="t_tb2_r2_c1"></td><td id="t_tb2_r2_c2"></td><td id="t_tb2_r2_c3"></td></tr>
                        <tr><td id="t_tb2_r3_c1"></td><td id="t_tb2_r3_c2"></td><td id="t_tb2_r3_c3"></td></tr>
                        <tr><td id="t_tb2_r4_c1"></td><td id="t_tb2_r4_c2"></td><td id="t_tb2_r4_c3"></td></tr>
                        <tr><td id="t_tb2_r5_c1"></td><td id="t_tb2_r5_c2"></td><td id="t_tb2_r5_c3"></td></tr>
                        <tr><td id="t_tb2_r6_c1"></td><td id="t_tb2_r6_c2"></td><td id="t_tb2_r6_c3"></td></tr>
                    </tbody>
                </table>

                <div class="section-title" id="t_s4_title" style="margin-top: 10px;"></div>
                <div style="line-height: 1.4; margin-bottom: 6px;">
                    <div id="t_s4_p1"></div>
                    <div id="t_s4_p2"></div>
                    <div id="t_s4_p3"></div>
                    <div id="t_s4_p4"></div> 
                </div>

                <table class="custom-table">
                    <thead>
                        <tr>
                            <th id="t_tb3_h1" style="width: 25%;"></th>
                            <th id="t_tb3_h2" style="width: 35%;"></th>
                            <th id="t_tb3_h3" style="width: 40%;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td id="t_tb3_r1_c1"></td><td id="t_tb3_r1_c2"></td><td id="t_tb3_r1_c3"></td></tr>
                        <tr><td id="t_tb3_r2_c1"></td><td id="t_tb3_r2_c2"></td><td id="t_tb3_r2_c3"></td></tr>
                        <tr><td id="t_tb3_r3_c1"></td><td id="t_tb3_r3_c2"></td><td id="t_tb3_r3_c3"></td></tr>
                        <tr><td id="t_tb3_r4_c1"></td><td id="t_tb3_r4_c2"></td><td id="t_tb3_r4_c3"></td></tr>
                        <tr><td id="t_tb3_r5_c1"></td><td id="t_tb3_r5_c2"></td><td id="t_tb3_r5_c3"></td></tr>
                        <tr><td id="t_tb3_r6_c1"></td><td id="t_tb3_r6_c2"></td><td id="t_tb3_r6_c3"></td></tr>
                        <tr><td id="t_tb3_r7_c1"></td><td id="t_tb3_r7_c2"></td><td id="t_tb3_r7_c3"></td></tr>
                        <tr><td id="t_tb3_r8_c1"></td><td id="t_tb3_r8_c2"></td><td id="t_tb3_r8_c3"></td></tr>
                        <tr><td id="t_tb3_r9_c1"></td><td colspan="2" id="t_tb3_r9_c2"></td></tr>
                    </tbody>
                </table>
                
                <div id="t_bottom_title" style="font-weight: bold; margin-top: 10px; font-size: 10pt; color: #000;"></div>

                <div class="footer">
                    <span id="t_f2_text1"></span>
                    <span>Sayfa 2/2</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Yükleme Göstergesi -->
    <div id="loader">
        <div class="spinner"></div>
        <p class="mt-5 font-bold text-2xl tracking-wider text-white">PDF İşleniyor...</p>
        <p class="text-gray-400 mt-2 text-center px-4">Lütfen bekleyin, şablon yüksek çözünürlüklü olarak derleniyor.</p>
    </div>

    <!-- Bildirim -->
    <div id="toast"></div>

    <script>
        // Sayfa yüklendiğinde metin alanını boş bırak
        window.onload = function() {
            document.getElementById('csv-input').value = "";
        }

        function processAndDownloadPDF() {
            const text = document.getElementById('csv-input').value;
            
            const tokens = [];
            let currentToken = '';
            let inQuotes = false;
            
            // Virgülle ayrılmış CSV formatını işleyen akıllı ayrıştırıcı (yan yana yazıma tam uygun)
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                
                if (char === '"') {
                    if (inQuotes && text[i+1] === '"') {
                        currentToken += '"'; // Kaçış karakteri olarak çift tırnak (metin içindeki tırnaklar için)
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    tokens.push(currentToken.trim());
                    currentToken = '';
                } else {
                    currentToken += char;
                }
            }
            tokens.push(currentToken.trim());
            
            // Gizli DOM üzerindeki ID'leri bul ve verileri güncelle (Anahtar ve Değer eşleştirmesi)
            for (let i = 0; i < tokens.length; i += 2) {
                const key = tokens[i];
                // Eğer karşılık gelen bir değer yoksa boş bırak
                const value = tokens[i + 1] !== undefined ? tokens[i + 1] : '';
                
                if (key) {
                    const el = document.getElementById('t_' + key);
                    if (el) { el.innerHTML = value; }
                }
            }

            generatePDF();
        }

        function generatePDF() {
            const element = document.getElementById('pdf-root');
            const loader = document.getElementById('loader');
            
            // --- DOSYA ADI DİNAMİKLEŞTİRME BAŞLANGICI ---
            let pdfFilename = 'PDO_Vakasi'; // Varsayılan isim
            
            // İçerik güncellendikten sonra DOM'dan Başlık veya Alt Başlığı (Hastalık adı) alıyoruz
            const docSubtitle = document.getElementById('t_doc_subtitle').innerText.trim();
            const docTitle = document.getElementById('t_doc_title').innerText.trim();
            
            // Hastalık ismi genelde t_doc_subtitle'da olur. Yoksa docTitle'ı, o da yoksa varsayılanı kullanır.
            if (docSubtitle.length > 0) {
                pdfFilename = docSubtitle;
            } else if (docTitle.length > 0) {
                pdfFilename = docTitle;
            }
            
            // Dosya isminde geçersiz olabilecek / ? < > \ : * | " gibi karakterleri silip boşlukları "_" (alt tire) yapar
            pdfFilename = pdfFilename.replace(/[^a-zA-Z0-9ğüşıöçĞÜŞİÖÇ\s-]/g, '').trim().replace(/\s+/g, '_') + '.pdf';
            // --- DOSYA ADI DİNAMİKLEŞTİRME BİTİŞİ ---

            // Yükleme ekranını göster (Arka planı tamamen siyah olduğu için PDF'in ekranda belirmesini gizler)
            loader.style.display = 'flex';

            // Kırpılma (clipping) sorununu çözmek için DOM'u sayfanın merkezine görünür halde koyuyoruz
            document.body.classList.add('generating-pdf');
            
            // Kullanıcı sayfayı kaydırmışsa render hatası olmaması için ekranı en üste sabitliyoruz
            window.scrollTo(0, 0); 

            // Çözünürlük ayarı: Mobilde çok yüksek kalite tarayıcıyı çökertebilir
            const isMobile = window.innerWidth < 768;
            const pdfScale = isMobile ? 2 : 3;

            const opt = {
                margin:       0, 
                filename:     pdfFilename, // Dinamik dosya adı buraya entegre edildi
                image:        { type: 'jpeg', quality: 1.0 }, 
                html2canvas:  { 
                    scale: pdfScale, 
                    useCORS: true,
                    letterRendering: true,
                    scrollX: 0, // Sayfa kaydırmasını sıfırla
                    scrollY: 0, 
                    windowWidth: 794 // A4 genişliği (Pixel karşılığı)
                },
                jsPDF:        { 
                    unit: 'mm', 
                    format: 'a4', 
                    orientation: 'portrait' 
                }
                // NOT: pagebreak ayarı KASITLI OLARAK kaldırıldı, çünkü CSS'te yüksekliği 593mm (sabit 2 sayfa) olarak kilitleyerek 3. sayfanın çıkması fiziksel olarak engellendi.
            };

            // DOM'un render edilmesi ve CSS'lerin oturması için 500ms bekletiyoruz
            setTimeout(() => {
                html2pdf().set(opt).from(element).save().then(() => {
                    // İşlem bitince her şeyi eski haline getir
                    loader.style.display = 'none';
                    document.body.classList.remove('generating-pdf'); 
                    showToast("Harika! PDF başarıyla dönüştürüldü.");
                }).catch(err => {
                    console.error("PDF Hatası:", err);
                    loader.style.display = 'none';
                    document.body.classList.remove('generating-pdf');
                    showToast("PDF dönüştürülürken bir hata oluştu.");
                });
            }, 500);
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }
    </script>
</body>
</html>
