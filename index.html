<head>

    <style>
        /* Genel Gövde Ayarları */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            position: relative;
            min-height: 100vh;
        }

        /* 
         * PDF ŞABLONU KESİN ÇÖZÜMÜ (KAYMA ENGELEYİCİ):
         * Şablon ekran dışına itilmez (-9999px YAPILMAZ). Tam (0,0) noktasında tutulur.
         * Kullanıcının görmemesi için opacity: 0.01 yapılır ve arkada bekletilir.
         */
        #pdf-template-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 210mm;
            z-index: 0;
            opacity: 0.01;
            pointer-events: none; /* Tıklamaları engelle */
            transform-origin: top left;
        }

        #pdf-root {
            background-color: #ffffff; /* Arka plan kesinlikle beyaz olmalı */
        }

        /* A4 Sayfa Stilleri */
        .page {
            width: 210mm;
            height: 297mm;
            background: white;
            padding: 12mm 15mm;
            box-sizing: border-box;
            position: relative;
            font-size: 9.5pt; /* Taşmayı önlemek için 9.5pt kullanıldı */
            line-height: 1.35;
            color: #000;
            overflow: hidden;
            margin: 0;
        }

        /* Sola dayalı başlıklar ve mavi/gri renk tonları (İstenilen Tasarım) */
        .doc-title { 
            font-size: 16pt; 
            font-weight: bold; 
            text-align: left; 
            margin-bottom: 4px; 
            color: #000; 
        }
        
        .doc-subtitle { 
            font-size: 11pt; 
            text-align: left; 
            font-weight: 600; 
            color: #1e3a8a; /* Koyu Mavi */
            margin-bottom: 12px; 
            border-bottom: 2px solid #1e3a8a; 
            padding-bottom: 6px; 
        }

        .section-title { 
            font-size: 10.5pt; 
            font-weight: bold; 
            background-color: #e2e8f0; /* Açık Gri/Mavi Arka Plan */
            padding: 4px 8px; 
            margin-top: 12px; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            color: #1e3a8a; /* Koyu Mavi Yazı */
            text-align: left;
        }
        
        /* Adım ve Akış Tasarımları */
        .step-container { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 3px; 
        }
        
        .step-number { 
            font-weight: bold; 
            font-size: 10pt; 
            width: 18px; 
            flex-shrink: 0; 
            text-align: left;
        }
        
        .step-content { 
            flex-grow: 1; 
            text-align: justify; 
        }

        /* Oklar Numaraların Altında */
        .arrow-down { 
            text-align: left; 
            margin-left: 3px; 
            margin-bottom: 3px;
            font-weight: bold; 
            font-size: 12pt; 
            color: #1e3a8a; /* Mavi ok */
        }

        /* Tablo Stilleri */
        .custom-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 8px; 
            margin-bottom: 8px; 
            font-size: 8.5pt;
        }
        
        .custom-table th, .custom-table td { 
            border: 1px solid #000; 
            padding: 5px 6px; 
            text-align: left; 
            vertical-align: top;
        }
        
        .custom-table th { 
            background-color: #f3f4f6;
            font-weight: bold; 
            color: #000;
        }
        
        .custom-table tr:nth-child(even) { 
            background-color: #f9fafb; 
        }

        /* Alt Bilgi (Footer) */
        .footer { 
            position: absolute; 
            bottom: 12mm; 
            left: 15mm; 
            right: 15mm; 
            font-size: 8pt; 
            display: flex; 
            justify-content: space-between; 
            border-top: 1px solid #ccc; 
            padding-top: 4px; 
        }

        /* Kullanıcı Arayüzü İçin Loader (Tam Kapatıcı Siyah Ekran) */
        #loader { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-color: #111827; 
            z-index: 9999; /* Her şeyin üstünde */
            color: white; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        
        .spinner { 
            border: 4px solid rgba(255,255,255,0.2); 
            border-top: 4px solid #3b82f6; 
            border-radius: 50%; 
            width: 50px; height: 50px; 
            animation: spin 1s linear infinite; 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* Bildirim (Toast) Mesajı */
        #toast { 
            visibility: hidden; 
            min-width: 250px; 
            background-color: #10b981; 
            color: #fff; 
            text-align: center; 
            border-radius: 8px; 
            padding: 16px; 
            position: fixed; 
            z-index: 10000; 
            left: 50%; bottom: 30px; 
            transform: translateX(-50%); 
            font-size: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        
        #toast.show { 
            visibility: visible; 
            animation: fadein 0.3s, fadeout 0.3s 2.7s; 
        }
        
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>

        // CSV Verilerini Şablona Aktarma
        function processAndDownloadPDF() {
            const text = document.getElementById('csv-input').value;
            const lines = text.split(/\r?\n/); 
            
            lines.forEach(line => {
                if (!line.trim()) return;
                const separatorIndex = line.indexOf('|');
                if (separatorIndex !== -1) {
                    const key = line.substring(0, separatorIndex).trim();
                    const value = line.substring(separatorIndex + 1).trim();
                    const el = document.getElementById('t_' + key);
                    if (el) { el.innerHTML = value; }
                }
            });

            generatePDF();
        }

        // KAYMAYI ENGELLEYEN VE HTML2PDF'Yİ ÇAĞIRAN GÜVENLİ FONKSİYON
        function generatePDF() {
            const wrapper = document.getElementById('pdf-template-wrapper');
            const loader = document.getElementById('loader');
            const element = document.getElementById('pdf-root');
            
            // 1. KAYMAYI (CROP) ÖNLEMEK İÇİN SAYFAYI EN TEPEYE AL
            window.scrollTo(0, 0);

            // 2. Siyah yükleme ekranını açarak kullanıcıdan arka planı gizle
            loader.style.display = 'flex';

            // 3. UI'ın yüklenmesi için 500ms bekle, ardından PDF'i oluştur
            setTimeout(() => {
                
                // Şablonu görünür yap (Siyah ekranın arkasında kalacak)
                wrapper.style.opacity = '1';
                wrapper.style.zIndex = '50';

                // Yüksek Kalite PDF Ayarları (Scroll 0 olarak zorlanmıştır)
                const opt = {
                    margin:       0,
                    filename:     'PDO_Modulu.pdf',
                    image:        { type: 'jpeg', quality: 1.0 },
                    html2canvas:  { 
                        scale: 2, // HD Kalite (Mobil için 3 yerine 2 kullanıldı, çökmeyi önler)
                        useCORS: true,
                        scrollX: 0, 
                        scrollY: 0,
                        windowWidth: document.documentElement.offsetWidth,
                        windowHeight: document.documentElement.offsetHeight
                    },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                // Dönüştürme işlemini başlat
                html2pdf().set(opt).from(element).save().then(() => {
                    // İşlem bitince şablonu tekrar gizle
                    wrapper.style.opacity = '0.01';
                    wrapper.style.zIndex = '0';
                    loader.style.display = 'none';
                    showToast("PDF başarıyla indirildi!");
                }).catch(err => {
                    console.error("PDF Hatası: ", err);
                    wrapper.style.opacity = '0.01';
                    wrapper.style.zIndex = '0';
                    loader.style.display = 'none';
                    showToast("PDF oluşturulurken bir hata oluştu.");
                });

            }, 500); // 500ms bekleme süresi tarayıcının render edebilmesi için hayati önem taşır
        }

        // Toast Mesaj Fonksiyonu
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }
    </script>
