    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 
         * PDF Şablonu İçin A4 Stilleri 
         */
        #pdf-template-wrapper {
            display: none; /* Normalde tamamen kapalı, sadece buton basılınca açılır */
        }

        /* 
         * Kırpılma (Clipping) ve 3. Boş Sayfa Hatası Çözümü:
         * PDF oluşturulurken wrapper tam ekranın sol üstüne alınır ve tam görünür yapılır.
         * Toplam yükseklik 593mm (2 sayfa) olarak sabitlenir ki fazladan beyaz sayfa atmasın.
         */
        body.generating-pdf #pdf-template-wrapper {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 210mm; 
            height: 593mm; /* Sadece 2 sayfa kadar yükseklik. Fazladan sayfayı engeller. */
            z-index: 10;
            background: white; 
            overflow: hidden;
        }

        .page {
            width: 210mm;
            height: 296.5mm; /* 297mm yerine 0.5mm az verildi, 3. sayfaya taşma engellendi */
            background: white;
            padding: 10mm 15mm; 
            box-sizing: border-box;
            position: relative;
            font-size: 9.5pt; 
            line-height: 1.35;
            color: #000;
            overflow: hidden; 
            margin: 0;
        }

        /* Sola dayalı başlıklar */
        .doc-title { 
            font-size: 16pt; 
            font-weight: bold; 
            text-align: left; 
            margin-bottom: 2px; 
            color: #000; 
        }
        
        .doc-subtitle { 
            font-size: 11pt; 
            text-align: left; 
            font-weight: 600; 
            color: #1e3a8a; /* Koyu mavi */
            margin-bottom: 10px; 
            border-bottom: 2px solid #1e3a8a; 
            padding-bottom: 6px; 
        }

        /* Orijinal tasarımdaki gri/mavi arka planlı alt başlıklar */
        .section-title { 
            font-size: 10.5pt; 
            font-weight: bold; 
            background-color: #e2e8f0; 
            padding: 4px 8px; 
            margin-top: 12px; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            color: #1e3a8a; 
        }
        
        .step-container { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 2px; 
        }
        
        .step-number { 
            font-weight: bold; 
            font-size: 10pt; 
            width: 18px; 
            flex-shrink: 0; 
            text-align: left;
        }
        
        .step-content { 
            flex-grow: 1; 
            text-align: justify; 
        }

        /* Oklar sayfanın TAM ORTASINA hizalandı (En başa kayması engellendi) */
        .arrow-down { 
            text-align: center; /* Ortaya hizalama yapıldı */
            width: 100%;
            margin-top: 2px;
            margin-bottom: 2px;
            font-weight: bold; 
            font-size: 14pt; /* Oklar belirginleştirildi */
            color: #1e3a8a; 
        }

        .custom-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 6px; 
            margin-bottom: 6px; 
            font-size: 8.5pt; 
        }
        
        .custom-table th, .custom-table td { 
            border: 1px solid #000; 
            padding: 4px 6px; 
            text-align: left; 
            vertical-align: top;
        }
        
        .custom-table th { 
            background-color: #d1d5db; 
            font-weight: bold; 
        }
        
        .custom-table tr:nth-child(even) { 
            background-color: #f9fafb; 
        }

        .footer { 
            position: absolute; 
            bottom: 10mm; 
            left: 15mm; 
            right: 15mm; 
            font-size: 8pt; 
            display: flex; 
            justify-content: space-between; 
            border-top: 1px solid #ccc; 
            padding-top: 4px; 
        }

        /* Loader %100 mat ve kapatıcı (arkadaki PDF'i gizler) */
        #loader { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-color: #111827; 
            z-index: 100; 
            color: white; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        
        .spinner { 
            border: 4px solid rgba(255,255,255,0.2); 
            border-top: 4px solid #3b82f6; 
            border-radius: 50%; 
            width: 50px; height: 50px; 
            animation: spin 1s linear infinite; 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* Bildirim (Toast) Mesajı */
        #toast { 
            visibility: hidden; 
            min-width: 250px; 
            background-color: #10b981; 
            color: #fff; 
            text-align: center; 
            border-radius: 8px; 
            padding: 16px; 
            position: fixed; 
            z-index: 150; 
            left: 50%; bottom: 30px; 
            transform: translateX(-50%); 
            font-size: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        
        #toast.show { 
            visibility: visible; 
            animation: fadein 0.3s, fadeout 0.3s 2.7s; 
        }
        
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>

s4_p4|<b>Fizik Muayene:</b> Ateş: 37.8°C, Nabız: 104/dk (sinüzal), KB: 125/80 mmHg. Genel durum orta, hafif soluk ve sklera ikterik. Alt ekstremitelerde ve ön kolda basmakla solmayan dağınık peteşi ve palpabl olmayan purpurik lezyonlar mevcut. Organomegali veya lenfadenopati yok. <br><b>Nörolojik muayene:</b> Bilinç açık, oryantasyon tam ancak yer yer yavaş yanıt veriyor, fokal motor defisit yok.

        function processAndDownloadPDF() {
            const text = document.getElementById('csv-input').value;
            // İşletim sistemleri arası satır sonu farklılıklarını düzeltmek için Regex
            const lines = text.split(/\r?\n/); 
            
            // Gizli DOM üzerindeki ID'leri bul ve verileri güncelle
            lines.forEach(line => {
                if (!line.trim()) return; // Boş satırları atla
                const separatorIndex = line.indexOf('|');
                if (separatorIndex !== -1) {
                    const key = line.substring(0, separatorIndex).trim();
                    const value = line.substring(separatorIndex + 1).trim();
                    
                    const el = document.getElementById('t_' + key);
                    if (el) { el.innerHTML = value; }
                }
            });

            generatePDF();
        }

        function generatePDF() {
            const element = document.getElementById('pdf-root');
            const loader = document.getElementById('loader');
            
            // Yükleme ekranını göster (Arka planı tamamen siyah olduğu için PDF'in ekranda belirmesini gizler)
            loader.style.display = 'flex';

            // Kırpılma (clipping) sorununu çözmek için DOM'u sayfanın merkezine görünür halde koyuyoruz
            document.body.classList.add('generating-pdf');
            
            // Kullanıcı sayfayı kaydırmışsa render hatası olmaması için ekranı en üste sabitliyoruz
            window.scrollTo(0, 0); 

            // Çözünürlük ayarı: Mobilde çok yüksek kalite tarayıcıyı çökertebilir
            const isMobile = window.innerWidth < 768;
            const pdfScale = isMobile ? 2 : 3;

            const opt = {
                margin:       0, 
                filename:     'PDO_Vakasi.pdf',
                image:        { type: 'jpeg', quality: 1.0 }, 
                html2canvas:  { 
                    scale: pdfScale, 
                    useCORS: true,
                    letterRendering: true,
                    scrollX: 0, // Sayfa kaydırmasını sıfırla
                    scrollY: 0, 
                    windowWidth: 794 // A4 genişliği (Pixel karşılığı)
                },
                jsPDF:        { 
                    unit: 'mm', 
                    format: 'a4', 
                    orientation: 'portrait' 
                }
                // NOT: pagebreak ayarı KASITLI OLARAK kaldırıldı, çünkü CSS'te yüksekliği 593mm (sabit 2 sayfa) olarak kilitleyerek 3. sayfanın çıkması fiziksel olarak engellendi.
            };

            // DOM'un render edilmesi ve CSS'lerin oturması için 500ms bekletiyoruz
            setTimeout(() => {
                html2pdf().set(opt).from(element).save().then(() => {
                    // İşlem bitince her şeyi eski haline getir
                    loader.style.display = 'none';
                    document.body.classList.remove('generating-pdf'); 
                    showToast("Harika! PDF başarıyla dönüştürüldü.");
                }).catch(err => {
                    console.error("PDF Hatası:", err);
                    loader.style.display = 'none';
                    document.body.classList.remove('generating-pdf');
                    showToast("PDF dönüştürülürken bir hata oluştu.");
                });
            }, 500);
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }
    </script>
